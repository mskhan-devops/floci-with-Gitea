name: Test Local Deployment to Floci
on: [push]

jobs:
  aws-deployment:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull your repository code down
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install AWS CLI tools into the short-lived runner container
      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      # Step 3: Interact with Floci using standard AWS commands
      - name: Deploy to Local Cloud
        run: |
          # 1. Define AWS variables pointing to the Floci container name on the bridge network
          export AWS_ENDPOINT_URL="http://floci:4566"
          export AWS_ACCESS_KEY_ID="mock-key"
          export AWS_SECRET_ACCESS_KEY="mock-secret"
          export AWS_DEFAULT_REGION="us-east-1"
          
          echo "=== Testing S3 Cloud Infrastructure ==="
          # Create an S3 Bucket inside Floci
          aws s3 mb s3://my-local-pipeline-bucket
          
          # List buckets to confirm
          aws s3 ls
          
          echo "=== Infrastructure Confirmed on Floci ==="
